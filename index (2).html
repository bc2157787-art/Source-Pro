    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      font-family: 'DM Sans', -apple-system, sans-serif;
      background: #0a0a0a;
      color: #fff;
      min-height: 100vh;
    }
    
    .gradient-text {
      background: linear-gradient(135deg, #f5d485 0%, #e8a849 50%, #d4943a 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    .glow-border {
      position: relative;
    }
    
    .glow-border::before {
      content: '';
      position: absolute;
      inset: -1px;
      background: linear-gradient(135deg, #e8a849 0%, transparent 50%, #e8a849 100%);
      border-radius: inherit;
      z-index: -1;
      opacity: 0.5;
    }
    
    .card-hover {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    
    .card-hover:hover {
      transform: translateY(-4px);
      box-shadow: 0 20px 40px rgba(232, 168, 73, 0.15);
    }
    
    .pulse {
      animation: pulse 2s infinite;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    
    .fade-in {
      animation: fadeIn 0.6s ease-out;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .shine {
      position: relative;
      overflow: hidden;
    }
    
    .shine::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(
        to right,
        transparent 0%,
        rgba(255,255,255,0.1) 50%,
        transparent 100%
      );
      transform: rotate(30deg);
      animation: shine 3s infinite;
    }
    
    @keyframes shine {
      0% { transform: translateX(-100%) rotate(30deg); }
      100% { transform: translateX(100%) rotate(30deg); }
    }
    
    .slide-in {
      animation: slideIn 0.4s ease-out;
    }
    
    @keyframes slideIn {
      from { opacity: 0; transform: translateX(20px); }
      to { opacity: 1; transform: translateX(0); }
    }
    
    input, textarea {
      font-family: inherit;
    }
    
    button {
      font-family: inherit;
      cursor: pointer;
    }
    
    ::-webkit-scrollbar {
      width: 8px;
    }
    
    ::-webkit-scrollbar-track {
      background: #1a1a1a;
    }
    
    ::-webkit-scrollbar-thumb {
      background: #333;
      border-radius: 4px;
    }
    
    ::-webkit-scrollbar-thumb:hover {
      background: #444;
    }
    
    html {
      scroll-behavior: smooth;
    }

                  border: '1px solid #333',
                  color: '#fff',
                  borderRadius: 10,
                  fontSize: 14,
                  fontWeight: 500
                }}
              >
                Back

              <button
                onClick={() => step < 4 ? setStep(step + 1) : navigate('dashboard')}
                style={{
                  padding: '14px 28px',
                  background: 'linear-gradient(135deg, #e8a849, #d4943a)',
                  border: 'none',

                  fontWeight: 600,
                  display: 'flex',
                  alignItems: 'center',
                  gap: 8
                }}
              >
                {step < 4 ? 'Continue' : 'Go to Dashboard'} <Icon name="arrowRight" size={18} />
              </button>
            </div>
          </div>
        </div>
      );
    }

  </script>
